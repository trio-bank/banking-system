<header class="topbar" [class.scrolled]="scrolled()">
  <a class="brand" routerLink="/app/dashboard">
    <span class="brand-mark" aria-hidden="true"></span>
    Trio Bank
  </a>

  <nav class="links" aria-label="Main">
    @for (item of topLinks; track item.link) {
      @let active = isActive(item);
      <a
        [routerLink]="item.link"
        [class.active]="active"
        [attr.aria-current]="active ? 'page' : null"
      >
        <mat-icon [class.filled]="active" aria-hidden="true">{{ item.icon }}</mat-icon>
        {{ item.label }}
      </a>
    }
  </nav>

  <!-- Wide screens: everything in the bar. -->
  <div class="end wide-only">
    <app-theme-toggle />
    <a class="avatar" routerLink="/app/profile" aria-label="My profile" title="My profile">
      {{ initials() }}
    </a>
    <app-logout-button />
  </div>

  <!-- Phones: only the avatar; profile, theme and logout are in its menu. -->
  <button
    type="button"
    class="avatar phone-only"
    aria-label="Account menu"
    [matMenuTriggerFor]="accountMenu"
  >
    {{ initials() }}
  </button>
</header>

<mat-menu #accountMenu="matMenu" xPosition="before" class="account-menu">
  <div class="menu-head">
    <span class="menu-name">{{ fullName() }}</span>
    <span class="menu-email">{{ email() }}</span>
  </div>
  <a mat-menu-item routerLink="/app/profile">
    <mat-icon>person</mat-icon>
    My profile
  </a>
  <button mat-menu-item type="button" (click)="theme.toggle()">
    <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    {{ theme.isDark() ? 'Light theme' : 'Dark theme' }}
  </button>
  <button mat-menu-item type="button" [disabled]="loggingOut()" (click)="logOut()">
    <mat-icon>logout</mat-icon>
    Log out
  </button>
</mat-menu>

<main class="shell-content">
  <router-outlet />
</main>

<nav class="tabs" aria-label="Main">
  @for (item of tabs; track item.link) {
    @let active = isActive(item);
    <a
      [routerLink]="item.link"
      [class.active]="active"
      [attr.aria-current]="active ? 'page' : null"
    >
      <mat-icon [class.filled]="active" aria-hidden="true">{{ item.icon }}</mat-icon>
      {{ item.label }}
    </a>
  }
</nav>
