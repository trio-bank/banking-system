<header class="topbar" [class.scrolled]="scrolled()">
  <a class="brand" routerLink="/app/dashboard">
    <span class="brand-mark" aria-hidden="true"></span>
    Trio Bank
  </a>

  <nav class="links" aria-label="Main">
    @for (item of topLinks; track item.link) {
      @let active = isActive(item);
      <a
        [routerLink]="item.link"
        [class.active]="active"
        [attr.aria-current]="active ? 'page' : null"
      >
        <mat-icon [class.filled]="active" aria-hidden="true">{{ item.icon }}</mat-icon>
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="end">
    <app-theme-toggle />
    <a class="avatar" routerLink="/app/profile" aria-label="My profile" title="My profile">
      {{ initials() }}
    </a>
    <app-logout-button />
  </div>
</header>

<main class="shell-content">
  <router-outlet />
</main>

<nav class="tabs" aria-label="Main">
  @for (item of tabs; track item.link) {
    @let active = isActive(item);
    <a
      [routerLink]="item.link"
      [class.active]="active"
      [attr.aria-current]="active ? 'page' : null"
    >
      <mat-icon [class.filled]="active" aria-hidden="true">{{ item.icon }}</mat-icon>
      {{ item.label }}
    </a>
  }
</nav>
