<a matButton class="back" routerLink="/app/dashboard">← My accounts</a>

<h1>ATM</h1>

@if (loading()) {
  <div class="state" role="status">
    <mat-spinner diameter="40" />
    <span>Loading your accounts…</span>
  </div>
} @else if (error(); as message) {
  <div class="banner" role="alert">
    <span>{{ message }}</span>
    <button matButton type="button" (click)="load()">Try again</button>
  </div>
} @else if (accounts()) {
  @if (!hasActive()) {
    <div class="empty">
      <p>The ATM works only with an active personal account, and you don't have one.</p>
      <a matButton="filled" routerLink="/app/accounts/new">Open account</a>
    </div>
  } @else {
    <!-- One operation for now, so no tabs. #106 adds Withdraw and a switch between the two. -->
    <h2>Deposit cash</h2>
    <app-atm-operation kind="deposit" [accounts]="personal()" (accountChanged)="replace($event)" />
  }
}
