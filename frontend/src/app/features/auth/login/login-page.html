<app-auth-layout title="Welcome back" subtitle="Log in to see your accounts.">
  <h2 class="form-title">Log in</h2>

  @if (notice(); as message) {
    <p class="notice" role="status">
      <mat-icon aria-hidden="true">schedule</mat-icon>
      <span>{{ message }}</span>
    </p>
  }
  @if (banner(); as message) {
    <p class="banner" role="alert">
      <mat-icon aria-hidden="true">error</mat-icon>
      <span>
        {{ message }}
        @if (timeLeft(); as time) {
          <span class="countdown">Try again in {{ time }}</span>
        }
      </span>
    </p>
  }

  <form class="login-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="username" />
      <mat-error>{{ emailError() }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input
        matInput
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
      />
      <button
        matIconButton
        matSuffix
        type="button"
        class="toggle-password"
        aria-label="Show password"
        [attr.aria-pressed]="showPassword()"
        (click)="showPassword.set(!showPassword())"
      >
        <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>{{ passwordError() }}</mat-error>
    </mat-form-field>

    <button matButton="filled" type="submit" [disabled]="submitting() || locked()">
      @if (submitting()) {
        <mat-spinner diameter="18" aria-label="Logging in" />
      }
      Log in
    </button>
  </form>

  <p class="divider">New to Trio Bank?</p>
  <a matButton="outlined" class="alt-action" routerLink="/register">Create an account</a>
</app-auth-layout>
