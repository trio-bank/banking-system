<app-auth-layout title="You're in" subtitle="Welcome to Trio Bank.">
  @if (registration; as result) {
    <h2 class="form-title">Your account is ready</h2>
    <p class="intro">Save your customer number and first account number:</p>
    <dl class="result">
      <dt>Customer number</dt>
      <dd>{{ result.customerNumber }}</dd>
      <dt>Account number (IBAN)</dt>
      <dd>{{ result.account.iban | iban }}</dd>
    </dl>
    <a matButton="filled" class="go-login" routerLink="/login">Go to login</a>
  }
</app-auth-layout>
