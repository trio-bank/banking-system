services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: triobank
      POSTGRES_USER: ${DB_USER:-triobank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-triobank}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/triobank
      DB_USER: ${DB_USER:-triobank}
      DB_PASSWORD: ${DB_PASSWORD:-triobank}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db-data:
