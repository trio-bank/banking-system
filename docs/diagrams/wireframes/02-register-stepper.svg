<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1120" viewBox="0 0 1160 1120">
  <title>Wireframe: Register, 4 steps</title>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #333; }
    .muted { fill: #777; }
    .light { fill: #fff; }
    .card { fill: #fff; stroke: #888; }
    .field { fill: #fff; stroke: #888; }
    .btn { fill: #bbb; }
    .dash { fill: none; stroke: #999; stroke-dasharray: 6 4; }
    .todo { fill: #fff; stroke: #888; }
    .now { fill: #333; }
    .done { fill: #888; }
    .line { stroke: #aaa; }
  </style>

  <rect width="1160" height="1120" fill="#f4f4f4" />

  <!-- ===== Step 1: Account ===== -->
  <g transform="translate(0 20)">
    <text x="0" y="0" font-size="15" font-weight="bold">Step 1 · Account</text>
    <g transform="translate(0 12)">
      <rect width="560" height="520" rx="8" class="card" />
      <text x="24" y="38" font-size="20" font-weight="bold">Register</text>
      <text x="24" y="58" font-size="12" class="muted">Open your first Trio Bank account</text>

      <line x1="70" y1="90" x2="460" y2="90" class="line" />
      <circle cx="70" cy="90" r="12" class="now" />
      <text x="70" y="95" font-size="12" text-anchor="middle" class="light">1</text>
      <circle cx="200" cy="90" r="12" class="todo" />
      <text x="200" y="95" font-size="12" text-anchor="middle">2</text>
      <circle cx="330" cy="90" r="12" class="todo" />
      <text x="330" y="95" font-size="12" text-anchor="middle">3</text>
      <circle cx="460" cy="90" r="12" class="todo" />
      <text x="460" y="95" font-size="12" text-anchor="middle">4</text>
      <text x="70" y="120" font-size="12" text-anchor="middle" font-weight="bold">Account</text>
      <text x="200" y="120" font-size="12" text-anchor="middle" class="muted">Personal data</text>
      <text x="330" y="120" font-size="12" text-anchor="middle" class="muted">Address</text>
      <text x="460" y="120" font-size="12" text-anchor="middle" class="muted">Summary</text>

      <rect x="24" y="140" width="512" height="44" rx="4" class="field" />
      <text x="36" y="167" font-size="14" class="muted">Email</text>
      <rect x="24" y="196" width="512" height="44" rx="4" class="field" />
      <text x="36" y="223" font-size="14" class="muted">Password</text>

      <rect x="24" y="256" width="166" height="6" fill="#555" />
      <rect x="197" y="256" width="166" height="6" fill="#555" />
      <rect x="370" y="256" width="166" height="6" fill="#ddd" />
      <text x="24" y="282" font-size="12" font-weight="bold">Password strength: medium</text>
      <text x="24" y="304" font-size="11">✓ 12–128 characters</text>
      <text x="24" y="320" font-size="11">✓ A lowercase letter</text>
      <text x="24" y="336" font-size="11">✓ An uppercase letter</text>
      <text x="24" y="352" font-size="11">✓ A digit</text>
      <text x="24" y="368" font-size="11" class="muted">○ A special character</text>
      <text x="24" y="384" font-size="11">✓ Does not contain the part of your email before @</text>

      <rect x="436" y="440" width="100" height="36" rx="6" class="btn" />
      <text x="486" y="463" font-size="13" font-weight="bold" text-anchor="middle">Next</text>
      <text x="24" y="500" font-size="12" text-decoration="underline">I already have an account</text>
    </g>
  </g>

  <!-- ===== Step 2: Personal data ===== -->
  <g transform="translate(600 20)">
    <text x="0" y="0" font-size="15" font-weight="bold">Step 2 · Personal data</text>
    <g transform="translate(0 12)">
      <rect width="560" height="520" rx="8" class="card" />
      <text x="24" y="38" font-size="20" font-weight="bold">Register</text>
      <text x="24" y="58" font-size="12" class="muted">Open your first Trio Bank account</text>

      <line x1="70" y1="90" x2="460" y2="90" class="line" />
      <circle cx="70" cy="90" r="12" class="done" />
      <text x="70" y="95" font-size="12" text-anchor="middle" class="light">✓</text>
      <circle cx="200" cy="90" r="12" class="now" />
      <text x="200" y="95" font-size="12" text-anchor="middle" class="light">2</text>
      <circle cx="330" cy="90" r="12" class="todo" />
      <text x="330" y="95" font-size="12" text-anchor="middle">3</text>
      <circle cx="460" cy="90" r="12" class="todo" />
      <text x="460" y="95" font-size="12" text-anchor="middle">4</text>
      <text x="70" y="120" font-size="12" text-anchor="middle">Account</text>
      <text x="200" y="120" font-size="12" text-anchor="middle" font-weight="bold">Personal data</text>
      <text x="330" y="120" font-size="12" text-anchor="middle" class="muted">Address</text>
      <text x="460" y="120" font-size="12" text-anchor="middle" class="muted">Summary</text>

      <rect x="24" y="140" width="250" height="44" rx="4" class="field" />
      <text x="36" y="167" font-size="14" class="muted">First name</text>
      <rect x="286" y="140" width="250" height="44" rx="4" class="field" />
      <text x="298" y="167" font-size="14" class="muted">Last name</text>

      <rect x="24" y="196" width="512" height="44" rx="4" class="field" />
      <text x="36" y="223" font-size="14" class="muted">PESEL</text>
      <text x="36" y="256" font-size="11" font-weight="bold">Date of birth: 14.05.1990 (read from PESEL)</text>

      <rect x="24" y="272" width="512" height="44" rx="4" class="field" />
      <text x="36" y="299" font-size="14">+48 <tspan class="muted">Phone number</tspan></text>
      <text x="36" y="332" font-size="11" class="muted">Include the country code</text>

      <text x="390" y="463" font-size="13" font-weight="bold" text-anchor="middle">Back</text>
      <rect x="436" y="440" width="100" height="36" rx="6" class="btn" />
      <text x="486" y="463" font-size="13" font-weight="bold" text-anchor="middle">Next</text>
      <text x="24" y="500" font-size="12" text-decoration="underline">I already have an account</text>
    </g>
  </g>

  <!-- ===== Step 3: Address ===== -->
  <g transform="translate(0 570)">
    <text x="0" y="0" font-size="15" font-weight="bold">Step 3 · Address</text>
    <g transform="translate(0 12)">
      <rect width="560" height="520" rx="8" class="card" />
      <text x="24" y="38" font-size="20" font-weight="bold">Register</text>
      <text x="24" y="58" font-size="12" class="muted">Open your first Trio Bank account</text>

      <line x1="70" y1="90" x2="460" y2="90" class="line" />
      <circle cx="70" cy="90" r="12" class="done" />
      <text x="70" y="95" font-size="12" text-anchor="middle" class="light">✓</text>
      <circle cx="200" cy="90" r="12" class="done" />
      <text x="200" y="95" font-size="12" text-anchor="middle" class="light">✓</text>
      <circle cx="330" cy="90" r="12" class="now" />
      <text x="330" y="95" font-size="12" text-anchor="middle" class="light">3</text>
      <circle cx="460" cy="90" r="12" class="todo" />
      <text x="460" y="95" font-size="12" text-anchor="middle">4</text>
      <text x="70" y="120" font-size="12" text-anchor="middle">Account</text>
      <text x="200" y="120" font-size="12" text-anchor="middle">Personal data</text>
      <text x="330" y="120" font-size="12" text-anchor="middle" font-weight="bold">Address</text>
      <text x="460" y="120" font-size="12" text-anchor="middle" class="muted">Summary</text>

      <rect x="24" y="140" width="512" height="44" rx="4" class="field" />
      <text x="36" y="167" font-size="14" class="muted">Street</text>

      <rect x="24" y="196" width="250" height="44" rx="4" class="field" />
      <text x="36" y="223" font-size="14" class="muted">Building number</text>
      <rect x="286" y="196" width="250" height="44" rx="4" class="field" />
      <text x="298" y="223" font-size="14" class="muted">Apartment (optional)</text>

      <rect x="24" y="252" width="250" height="44" rx="4" class="field" />
      <text x="36" y="279" font-size="14" class="muted">Postal code</text>
      <text x="36" y="312" font-size="11" class="muted">For example 45-018</text>
      <rect x="286" y="252" width="250" height="44" rx="4" class="field" />
      <text x="298" y="279" font-size="14" class="muted">City</text>

      <text x="390" y="463" font-size="13" font-weight="bold" text-anchor="middle">Back</text>
      <rect x="436" y="440" width="100" height="36" rx="6" class="btn" />
      <text x="486" y="463" font-size="13" font-weight="bold" text-anchor="middle">Next</text>
      <text x="24" y="500" font-size="12" text-decoration="underline">I already have an account</text>
    </g>
  </g>

  <!-- ===== Step 4: Summary ===== -->
  <g transform="translate(600 570)">
    <text x="0" y="0" font-size="15" font-weight="bold">Step 4 · Summary</text>
    <g transform="translate(0 12)">
      <rect width="560" height="520" rx="8" class="card" />
      <text x="24" y="38" font-size="20" font-weight="bold">Register</text>
      <text x="24" y="58" font-size="12" class="muted">Open your first Trio Bank account</text>

      <line x1="70" y1="90" x2="460" y2="90" class="line" />
      <circle cx="70" cy="90" r="12" class="done" />
      <text x="70" y="95" font-size="12" text-anchor="middle" class="light">✓</text>
      <circle cx="200" cy="90" r="12" class="done" />
      <text x="200" y="95" font-size="12" text-anchor="middle" class="light">✓</text>
      <circle cx="330" cy="90" r="12" class="done" />
      <text x="330" y="95" font-size="12" text-anchor="middle" class="light">✓</text>
      <circle cx="460" cy="90" r="12" class="now" />
      <text x="460" y="95" font-size="12" text-anchor="middle" class="light">4</text>
      <text x="70" y="120" font-size="12" text-anchor="middle">Account</text>
      <text x="200" y="120" font-size="12" text-anchor="middle">Personal data</text>
      <text x="330" y="120" font-size="12" text-anchor="middle">Address</text>
      <text x="460" y="120" font-size="12" text-anchor="middle" font-weight="bold">Summary</text>

      <rect x="24" y="140" width="512" height="40" rx="4" class="dash" />
      <text x="36" y="164" font-size="11" class="muted">Error banner (only when needed, e.g. a server error)</text>

      <text x="24" y="212" font-size="13" class="muted">Email</text>
      <text x="170" y="212" font-size="13">jan.kowalski@example.com</text>
      <text x="24" y="236" font-size="13" class="muted">Name</text>
      <text x="170" y="236" font-size="13">Jan Kowalski</text>
      <text x="24" y="260" font-size="13" class="muted">PESEL</text>
      <text x="170" y="260" font-size="13">85110356782</text>
      <text x="24" y="284" font-size="13" class="muted">Date of birth</text>
      <text x="170" y="284" font-size="13">03.11.1985</text>
      <text x="24" y="308" font-size="13" class="muted">Phone</text>
      <text x="170" y="308" font-size="13">+48 601 234 567</text>
      <text x="24" y="332" font-size="13" class="muted">Address</text>
      <text x="170" y="332" font-size="13">Polna 5/2, 45-018 Opole</text>

      <text x="24" y="372" font-size="11" class="muted">Email or PESEL already taken → back to that step,</text>
      <text x="24" y="388" font-size="11" class="muted">with the error under the field.</text>

      <text x="340" y="463" font-size="13" font-weight="bold" text-anchor="middle">Back</text>
      <rect x="386" y="440" width="150" height="36" rx="6" class="btn" />
      <text x="461" y="463" font-size="13" font-weight="bold" text-anchor="middle">Create account</text>
      <text x="24" y="500" font-size="12" text-decoration="underline">I already have an account</text>
    </g>
  </g>
</svg>
