<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660">
  <title>Wireframe: Customer and admin toolbars, session warning</title>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #333; }
    .muted { fill: #777; }
    .light { fill: #fff; }
    .card { fill: #fff; stroke: #888; }
    .btn { fill: #bbb; }
    .placeholder { fill: #e4e4e4; }
  </style>

  <rect width="1160" height="660" fill="#f4f4f4" />

  <!-- ===== Customer ===== -->
  <text x="0" y="20" font-size="15" font-weight="bold">Customer pages (/app/...)</text>
  <g transform="translate(0 32)">
    <rect width="560" height="260" class="card" />
    <rect width="560" height="52" fill="#444" />
    <rect x="20" y="17" width="4" height="18" fill="#ccc" />
    <rect x="27" y="17" width="4" height="18" fill="#ccc" />
    <rect x="34" y="17" width="4" height="18" fill="#ccc" />
    <text x="48" y="33" font-size="18" class="light">Trio Bank</text>
    <text x="536" y="32" font-size="13" font-weight="bold" text-anchor="end" class="light">Log out</text>

    <text x="24" y="96" font-size="20" font-weight="bold">Page title</text>
    <rect x="24" y="116" width="512" height="12" class="placeholder" />
    <rect x="24" y="138" width="420" height="12" class="placeholder" />
    <rect x="24" y="170" width="246" height="66" class="placeholder" />
    <rect x="290" y="170" width="246" height="66" class="placeholder" />
    <text x="147" y="208" font-size="12" text-anchor="middle" class="muted">page content</text>
    <text x="413" y="208" font-size="12" text-anchor="middle" class="muted">page content</text>
  </g>

  <!-- ===== Admin ===== -->
  <text x="600" y="20" font-size="15" font-weight="bold">Admin pages (/admin/...)</text>
  <g transform="translate(600 32)">
    <rect width="560" height="260" class="card" />
    <rect width="560" height="52" fill="#444" />
    <rect x="20" y="17" width="4" height="18" fill="#ccc" />
    <rect x="27" y="17" width="4" height="18" fill="#ccc" />
    <rect x="34" y="17" width="4" height="18" fill="#ccc" />
    <text x="48" y="33" font-size="18" class="light">Trio Bank</text>
    <rect x="140" y="15" width="58" height="22" rx="11" fill="#ccc" />
    <text x="169" y="31" font-size="12" text-anchor="middle">Admin</text>
    <text x="536" y="32" font-size="13" font-weight="bold" text-anchor="end" class="light">Log out</text>

    <text x="24" y="96" font-size="20" font-weight="bold">Page title</text>
    <rect x="24" y="116" width="512" height="12" class="placeholder" />
    <rect x="24" y="138" width="420" height="12" class="placeholder" />
    <rect x="24" y="170" width="512" height="66" class="placeholder" />
    <text x="280" y="208" font-size="12" text-anchor="middle" class="muted">page content</text>
  </g>

  <!-- ===== Session warning ===== -->
  <text x="0" y="340" font-size="15" font-weight="bold">Session warning (any logged-in page)</text>
  <g transform="translate(0 352)">
    <rect width="560" height="260" class="card" />
    <rect width="560" height="52" fill="#444" />
    <text x="48" y="33" font-size="18" class="light">Trio Bank</text>
    <text x="24" y="96" font-size="20" font-weight="bold">Page title</text>
    <rect x="24" y="116" width="512" height="12" class="placeholder" />

    <rect width="560" height="260" fill="#000" opacity="0.35" />
    <rect x="100" y="60" width="360" height="150" rx="14" fill="#fff" />
    <text x="124" y="98" font-size="18">Are you still there?</text>
    <text x="124" y="126" font-size="12" class="muted">You will be logged out in <tspan font-weight="bold" fill="#333">57 s</tspan> because of</text>
    <text x="124" y="142" font-size="12" class="muted">inactivity.</text>
    <rect x="310" y="160" width="130" height="34" rx="6" class="btn" />
    <text x="375" y="182" font-size="12" font-weight="bold" text-anchor="middle">Stay logged in</text>
  </g>

  <g transform="translate(600 380)">
    <text x="0" y="0" font-size="14" font-weight="bold">When it shows up</text>
    <text x="0" y="28" font-size="13">• After 9 minutes without clicks, key presses or page changes</text>
    <text x="0" y="52" font-size="13">• Counts down 60 s; Esc and clicks outside do not close it</text>
    <text x="0" y="76" font-size="13">• "Stay logged in" starts the 9 minutes again</text>
    <text x="0" y="100" font-size="13">• No answer in 60 s → /login?reason=inactive</text>
    <text x="0" y="124" font-size="13">• Token ends (30 min) → /login?reason=expired</text>
    <text x="0" y="148" font-size="13">• "Log out" in the toolbar → /login, no message</text>
  </g>
</svg>
