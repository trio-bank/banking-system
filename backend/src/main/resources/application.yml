# Shared configuration for all profiles. Secrets come only from environment variables (docs/10 §7).
spring:
  application:
    name: trio-bank-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/triobank}
    username: ${DB_USER:triobank}
    password: ${DB_PASSWORD:triobank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC          # BR-27: timestamps stored in UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true               # RFC 9457 errors (ADR-0010)

bank:
  sort-code: "99900012"
  currency: PLN
  time-zone: Europe/Warsaw

security:
  jwt:
    secret: ${JWT_SECRET}         # required, >= 32 bytes
    ttl: PT30M
  lockout:
    max-attempts: 5
    duration: PT15M
  admin-bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

features:
  demo-jobs-endpoint: false

springdoc:
  api-docs:
    enabled: false                # enabled in local/demo only
  swagger-ui:
    enabled: false

logging:
  pattern:
    correlation: "[%X{traceId:-}] "   # request id from TraceIdFilter

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
